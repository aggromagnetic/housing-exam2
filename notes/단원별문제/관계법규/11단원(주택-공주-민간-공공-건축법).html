<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제28회 주택관리사보 관계법규 실전 통합 모의고사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d' },
                        darkbg: '#0f172a',
                        cardbg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glow-btn:hover { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        input[type="text"] { background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; }
        input[type="text"]:focus { border-color: #22c55e; outline: none; box-shadow: 0 0 0 2px rgba(34,197,94,0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- Header & Progress -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-2.5 py-1 rounded-full border border-emerald-500/20">실전 모의고사</span>
                <h1 class="text-lg md:text-xl font-bold text-slate-100">제28회 주택관리사보 관계법규</h1>
            </div>
            <div id="quiz-progress-text" class="text-sm font-medium text-slate-400">
                1 / 40 문항
            </div>
        </div>
        <div class="w-full bg-slate-800 h-1.5">
            <div id="quiz-progress-bar" class="bg-emerald-500 h-1.5 transition-all duration-300" style="width: 2.5%;"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-grow">
        <!-- Quiz View -->
        <div id="quiz-view" class="space-y-6">
            <div class="flex items-center justify-between">
                <span id="question-category" class="bg-slate-800 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-md border border-slate-700">
                    주택법
                </span>
                <span id="question-type-badge" class="text-xs text-slate-400">
                    객관식 5지선다
                </span>
            </div>

            <!-- Question Box -->
            <div class="bg-cardbg rounded-xl p-6 border border-slate-800 shadow-xl space-y-4">
                <h2 id="question-title" class="text-base md:text-lg font-semibold leading-relaxed text-slate-100">
                    <!-- Dynamic Question Text -->
                </h2>
                <div id="box-content" class="hidden bg-slate-900/80 p-4 rounded-lg border border-slate-700 text-sm text-slate-300 leading-relaxed font-mono whitespace-pre-line">
                    <!-- Extra Box Content -->
                </div>
            </div>

            <!-- Answer Options/Inputs -->
            <div id="options-container" class="space-y-3">
                <!-- Injected via JavaScript -->
            </div>

            <!-- Feedback & Detailed Explanation Box -->
            <div id="feedback-box" class="hidden rounded-xl p-6 border transition-all duration-300">
                <div id="feedback-status" class="text-lg font-bold mb-3 flex items-center space-x-2"></div>
                <div id="explanation-text" class="text-sm leading-relaxed space-y-2 text-slate-300"></div>
                <div id="correction-note" class="mt-4 pt-3 border-t border-slate-700/60 text-xs text-emerald-400 font-medium"></div>
            </div>

            <!-- Action Navigation Buttons -->
            <div class="flex items-center justify-between pt-4">
                <button id="btn-prev" onclick="prevQuestion()" class="px-4 py-2.5 rounded-lg bg-slate-800 text-slate-300 text-sm font-medium hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition">
                    이전 문제
                </button>
                <div class="flex space-x-3">
                    <button id="btn-submit" onclick="submitAnswer()" class="px-5 py-2.5 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-500 glow-btn transition">
                        정답 제출
                    </button>
                    <button id="btn-next" onclick="nextQuestion()" class="px-5 py-2.5 rounded-lg bg-slate-700 text-slate-100 text-sm font-semibold hover:bg-slate-600 transition">
                        다음 문제
                    </button>
                </div>
            </div>
        </div>

        <!-- Result View -->
        <div id="result-view" class="hidden space-y-8 py-4">
            <div class="bg-cardbg rounded-2xl p-8 border border-slate-800 text-center space-y-4">
                <span class="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-500/20">시험 종료</span>
                <h2 class="text-2xl font-bold text-slate-100">모의고사 최종 성적</h2>
                <div class="py-4">
                    <div id="final-score" class="text-5xl font-extrabold text-emerald-400">0 / 100점</div>
                    <p id="score-summary-text" class="text-sm text-slate-400 mt-2">총 40문항 중 0문항 정답</p>
                </div>
                <button onclick="restartQuiz()" class="px-6 py-3 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-500 transition">
                    다시 풀어보기
                </button>
            </div>

            <!-- Incorrect Answer Summary -->
            <div class="space-y-4">
                <h3 class="text-lg font-bold text-slate-200 flex items-center justify-between">
                    <span>🎓 핵심 법률 오답 노트</span>
                    <span id="wrong-count-badge" class="text-xs bg-red-500/10 text-red-400 px-2.5 py-1 rounded-full border border-red-500/20">오답 0개</span>
                </h3>
                <div id="wrong-answer-list" class="space-y-4">
                    <!-- Injected via JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        제28회 주택관리사보 자격시험 대비 관계법규 실전 모의고사 | 최신 법령 완료 반영
    </footer>

    <script>
        const questions = [
            {

                options: [
                    "조합원의 사망으로 인하여 그 지위를 상속받는 자가 조합원이 되는 경우",
                    "사업계획승인 이후에 입주자로 선정된 지위가 적법하게 양도·증여되어 지위가 변경된 경우(투기과열지구 전매제한 대상 제외)",
                    "조합원의 탈퇴 등으로 조합원 수가 주택건설 예정 세대수의 50퍼센트 미만이 되는 경우",
                    "조합원이 무자격자로 판명되어 조합원 자격을 상실하는 경우",
                    "조합원 개인의 경제적 사정으로 자발적 탈퇴를 요청하여 이사회가 이를 승인한 경우"

                    "관리주체는 입주자등이 회의록의 열람을 청구하거나 복사를 요구하는 때에는 관리규약으로 정하는 바에 따라 이에 응하여야 한다."

                explanation: "<b>[근거: 공동주택관리법 제13조 및 시행령]</b> 300세대 미만인 공동주택이라 하더라도 관리규약으로 정하는 바에 따라 회의록을 공개할 수 있습니다. 따라서 '어떠한 경우에도 공개할 수 없다'는 지문은 틀립니다.",

                wrongGuide: "④번: 층수가 30층 미만이더라도 높이가 120미터 이상이면 고층건축물에 해당합니다."
            },
            {

                category: "민간임대주택 특별법",

                options: [

                    "둘 이상의 민간임대주택단지를 공동으로 관리하는 것이 합리적이라고 시·도지사가 인정하는 경우에만 공동관리를 제안할 수 있다.",

        let currentQuestionIdx = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let submittedStatus = new Array(questions.length).fill(false);

        document.addEventListener('DOMContentLoaded', () => {
            renderQuestion();
        });

        function renderQuestion() {
            const q = questions[currentQuestionIdx];
            
            // Header Progress
            document.getElementById('quiz-progress-text').innerText = `${currentQuestionIdx + 1} / ${questions.length} 문항`;
            document.getElementById('quiz-progress-bar').style.width = `${((currentQuestionIdx + 1) / questions.length) * 100}%`;
            
            // Category & Type Badge
            document.getElementById('question-category').innerText = q.category;
            document.getElementById('question-type-badge').innerText = q.type === 'choice' ? '객관식 5지선다' : '주관식 단답/기입형';
            document.getElementById('question-title').innerText = q.text;

            // Optional Box Content
            const boxElem = document.getElementById('box-content');
            if (q.box) {
                boxElem.classList.remove('hidden');
                boxElem.innerText = q.box;
            } else {
                boxElem.classList.add('hidden');
            }

            // Container Rendering
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const isSubmitted = submittedStatus[currentQuestionIdx];

            if (q.type === 'choice') {
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `w-full text-left p-4 rounded-xl border text-sm flex items-start space-x-3 transition ${
                        userAnswers[currentQuestionIdx] === idx 
                        ? 'border-emerald-500 bg-emerald-500/10 text-emerald-300 font-semibold' 
                        : 'border-slate-800 bg-slate-800/60 hover:bg-slate-800 text-slate-300'
                    }`;
                    if (isSubmitted) btn.disabled = true;

                    const numSpan = document.createElement('span');
                    numSpan.className = 'inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-700/80 text-xs font-bold text-slate-200 shrink-0';
                    numSpan.innerText = ['①', '②', '③', '④', '⑤'][idx];

                    const textSpan = document.createElement('span');
                    textSpan.className = 'pt-0.5 leading-relaxed';
                    textSpan.innerText = opt;

                    btn.appendChild(numSpan);
                    btn.appendChild(textSpan);

                    btn.onclick = () => {
                        if (submittedStatus[currentQuestionIdx]) return;
                        userAnswers[currentQuestionIdx] = idx;
                        renderQuestion();
                    };

                    container.appendChild(btn);
                });
            } else {
                // Short Subjective Input
                const wrap = document.createElement('div');
                wrap.className = 'space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-800';

                const storedAns = userAnswers[currentQuestionIdx] || new Array(q.inputsCount).fill('');
                
                for (let i = 0; i < q.inputsCount; i++) {
                    const row = document.createElement('div');
                    row.className = 'flex items-center space-x-3';
                    
                    const label = document.createElement('span');
                    label.className = 'text-xs font-bold text-emerald-400 w-8';
                    label.innerText = q.inputsCount > 1 ? (i === 0 ? '㉠ :' : '㉡ :') : '정답 :';

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'flex-grow p-3 rounded-lg text-sm';
                    input.placeholder = '정답을 입력하세요';
                    input.value = storedAns[i] || '';
                    if (isSubmitted) input.disabled = true;

                    input.oninput = (e) => {
                        if (!Array.isArray(userAnswers[currentQuestionIdx])) {
                            userAnswers[currentQuestionIdx] = new Array(q.inputsCount).fill('');
                        }
                        userAnswers[currentQuestionIdx][i] = e.target.value.trim();
                    };

                    row.appendChild(label);
                    row.appendChild(input);
                    wrap.appendChild(row);
                }
                container.appendChild(wrap);
            }

            // Feedback Box Handling
            const feedbackBox = document.getElementById('feedback-box');
            if (isSubmitted) {
                feedbackBox.classList.remove('hidden');
                checkAnswerLogic(false);
            } else {
                feedbackBox.classList.add('hidden');
            }

            // Buttons State
            document.getElementById('btn-prev').disabled = currentQuestionIdx === 0;
            if (currentQuestionIdx === questions.length - 1) {
                document.getElementById('btn-next').innerText = '최종 결과 제출';
            } else {
                document.getElementById('btn-next').innerText = '다음 문제';
            }
        }

        function submitAnswer() {
            if (submittedStatus[currentQuestionIdx]) return;

            const q = questions[currentQuestionIdx];
            const uAns = userAnswers[currentQuestionIdx];

            if (uAns === null || uAns === undefined || (Array.isArray(uAns) && uAns.some(val => !val))) {
                const msgBox = document.createElement('div');
                msgBox.className = 'fixed bottom-5 right-5 bg-red-600 text-white px-4 py-2 rounded-lg text-sm shadow-lg z-50';
                msgBox.innerText = '답안을 입력하거나 선택해 주세요.';
                document.body.appendChild(msgBox);
                setTimeout(() => msgBox.remove(), 2000);
                return;
            }

            submittedStatus[currentQuestionIdx] = true;
            renderQuestion();
        }

        function checkAnswerLogic(scrollToBox = true) {
            const q = questions[currentQuestionIdx];
            const uAns = userAnswers[currentQuestionIdx];
            const feedbackBox = document.getElementById('feedback-box');
            const statusElem = document.getElementById('feedback-status');
            const expText = document.getElementById('explanation-text');
            const corrNote = document.getElementById('correction-note');

            let isCorrect = false;

            if (q.type === 'choice') {
                isCorrect = (uAns === q.correctAnswer);
            } else {
                if (Array.isArray(uAns)) {
                    isCorrect = uAns.every((val, idx) => {
                        if (!val) return false;
                        const target = q.correctAnswers[idx].trim().replace(/\s+/g, '');
                        const input = val.trim().replace(/\s+/g, '');
                        return input === target || (target === '2' && input === '이') || (target === '3' && input === '삼');
                    });
                }
            }

            if (isCorrect) {
                feedbackBox.className = 'rounded-xl p-6 border bg-emerald-950/30 border-emerald-500/50 text-slate-200';
                statusElem.innerHTML = `<span class="text-emerald-400">⭕ 정답입니다!</span>`;
            } else {
                feedbackBox.className = 'rounded-xl p-6 border bg-red-950/30 border-red-500/50 text-slate-200';
                statusElem.innerHTML = `<span class="text-red-400">❌ 오답입니다.</span>`;
            }

            expText.innerHTML = q.explanation;
            corrNote.innerHTML = `💡 일타강사 포인트: ${q.wrongGuide}`;

            if (scrollToBox) {
                feedbackBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function nextQuestion() {
            if (currentQuestionIdx < questions.length - 1) {
                currentQuestionIdx++;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestionIdx > 0) {
                currentQuestionIdx--;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function showResults() {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');

            let correctCount = 0;
            const wrongListContainer = document.getElementById('wrong-answer-list');
            wrongListContainer.innerHTML = '';

            questions.forEach((q, idx) => {
                const uAns = userAnswers[idx];
                let isCorrect = false;

                if (q.type === 'choice') {
                    isCorrect = (uAns === q.correctAnswer);
                } else {
                    if (Array.isArray(uAns)) {
                        isCorrect = uAns.every((val, i) => {
                            if (!val) return false;
                            const target = q.correctAnswers[i].trim().replace(/\s+/g, '');
                            const input = val.trim().replace(/\s+/g, '');
                            return input === target || (target === '2' && input === '이') || (target === '3' && input === '삼');
                        });
                    }
                }

                if (isCorrect) {
                    correctCount++;
                } else {
                    const item = document.createElement('div');
                    item.className = 'bg-cardbg rounded-xl p-5 border border-slate-800 space-y-3';
                    
                    let userAnsText = '미입력';
                    let correctAnsText = '';

                    if (q.type === 'choice') {
                        userAnsText = uAns !== null ? ['①', '②', '③', '④', '⑤'][uAns] : '미선택';
                        correctAnsText = ['①', '②', '③', '④', '⑤'][q.correctAnswer];
                    } else {
                        userAnsText = Array.isArray(uAns) ? uAns.join(', ') : '미입력';
                        correctAnsText = q.correctAnswers.join(', ');
                    }

                    item.innerHTML = `
                        <div class="flex items-center justify-between text-xs">
                            <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded border border-slate-700">${q.category}</span>
                            <span class="text-red-400 font-semibold">문제 ${q.id}번 오답</span>
                        </div>
                        <p class="text-sm font-semibold text-slate-200">${q.text}</p>
                        <div class="grid grid-cols-2 gap-2 text-xs bg-slate-900/60 p-3 rounded-lg">
                            <div><span class="text-slate-400">내 선택:</span> <span class="text-red-400 font-bold">${userAnsText}</span></div>
                            <div><span class="text-slate-400">정답:</span> <span class="text-emerald-400 font-bold">${correctAnsText}</span></div>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed">${q.explanation}</p>
                    `;
                    wrongListContainer.appendChild(item);
                }
            });

            const score = Math.round((correctCount / questions.length) * 100);
            document.getElementById('final-score').innerText = `${score}점`;
            document.getElementById('score-summary-text').innerText = `총 ${questions.length}문항 중 ${correctCount}문항 정답`;
            document.getElementById('wrong-count-badge').innerText = `오답 ${questions.length - correctCount}개`;

            if (questions.length - correctCount === 0) {
                wrongListContainer.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm bg-cardbg rounded-xl border border-slate-800">🎉 축하합니다! 모든 문제를 맞히셨습니다. Perfect!</div>`;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function restartQuiz() {
            currentQuestionIdx = 0;
            userAnswers = new Array(questions.length).fill(null);
            submittedStatus = new Array(questions.length).fill(false);
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            renderQuestion();
        }
    </script>
</body>
</html>
