          legalBasis: "「주택건설기준 등에 관한 규정」 제14조의2",
          detail: "경량충격음 및 중량충격음 모두 <b>49데시벨 이하</b>여야 합니다."
        }
      },
      {
        id: 39,
        type: "subjective",
        chapter: "제10장: 시설관리파트 (전기, 소방 제외)",
        weight: "10%",
        question: "39. 주택건설기준 등에 관한 규정에 규정된 비상급수시설의 확보량 기준이다. 빈칸 ㉠과 ㉡에 들어갈 알맞은 수치(톤)를 아라비아 숫자로 순서대로 쓰시오.",
        passage: "<b>1. 지하양수시설</b><br>- 양수 능력: 1일에 해당 주택단지의 매 세대당 (  ㉠  )톤(시·군지역은 0.1톤) 이상의 수량을 양수할 수 있을 것 (비상전원 및 펌프 설치)<br>- 연계 지하저수조: 해당 양수시설에는 매 세대당 (  ㉡  )톤 이상을 저수할 수 있는 지하저수조를 함께 설치할 것<br><br><b>2. 지하저수조 (일반 비상급수시설)</b><br>- 저수 능력: 고가수조 저수량(세대당 0.25톤까지 산입)을 포함하여 매 세대당 0.5톤(독신자용 주택은 0.25톤) 이상 저수할 것",
        answers: ["0.2", "0.3"],
        labels: ["㉠ 양수량(톤)", "㉡ 저수량(톤)"],
        explanation: {
          summary: "지하양수시설 양수능력은 세대당 0.2톤 이상, 연계 지하저수조는 세대당 0.3톤 이상입니다.",
          legalBasis: "「주택건설기준 등에 관한 규정」 제35조 (비상급수시설)",
          detail: "<b>💡 [비상급수시설 핵심 수치 총정리]</b><br>1. <b>지하양수시설 양수능력:</b> 세대당 <b>0.2톤</b> 이상 (시·군지역은 0.1톤 이상)<br>2. <b>양수시설 연계 지하저수조:</b> 세대당 <b>0.3톤</b> 이상<br>3. <b>일반 지하저수조 저수용량:</b> 세대당 <b>0.5톤</b> 이상 (고가수조 저수량은 세대당 0.25톤까지 포함 가능, 독신자용 주택은 0.25톤 이상)"
        }
      },
      {
        id: 40,
        type: "subjective",
        chapter: "제10장: 시설관리파트 (전기, 소방 제외)",
        weight: "10%",
        question: "40. 건축물의 설비기준 등에 관한 규칙상 상업지역 및 주거지역에서 건축물에 설치하는 냉방시설 및 환기시설의 배기구와 배기장치의 안전 지표에 관한 기준이다. 빈칸에 들어갈 수치를 아라비아 숫자로 쓰시오. (단위: 미터)",
        passage: "배기구 및 배기장치는 보행자나 인근 건축물 거주자에게 열기가 직접 닿지 않도록 도로면으로부터 (  ㉠  )미터 이상의 높이에 설치할 것",
        answers: ["2"],
        labels: ["㉠ 설치높이(m)"],
        explanation: {
          summary: "냉방시설 배기구는 도로면으로부터 2미터 이상의 높이에 설치하여야 합니다.",
          legalBasis: "「건축물의 설비기준 등에 관한 규칙」 제23조",
          detail: "열기 피해 방지를 위해 <b>2미터 이상</b> 높이 설치 의무."
        }
      }
    ];

    let currentIdx = 0;
    let userAnswers = {};
    let isSubmitted = false;

    // Load Quiz on Page Init
    window.onload = function() {
      renderQuestion();
    };

    function renderQuestion() {
      isSubmitted = false;
      const q = quizData[currentIdx];

      // Reset Visibility
      document.getElementById('explanation-card').classList.add('hidden');
      document.getElementById('submit-btn').classList.remove('hidden');

      // Header Progress Updates
      document.getElementById('progress-text').innerText = `${currentIdx + 1} / ${quizData.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;

      // Meta Data
      document.getElementById('question-type-badge').innerText = q.type === 'mcq' ? '객관식' : '주관식 단답형';
      document.getElementById('question-chapter').innerText = q.chapter;
      document.getElementById('question-weight').innerText = `비중: ${q.weight}`;

      // Question Text & Passage
      document.getElementById('question-text').innerText = q.question;
      const passageBox = document.getElementById('passage-box');
      if (q.passage) {
        passageBox.innerHTML = q.passage;
        passageBox.classList.remove('hidden');
      } else {
        passageBox.classList.add('hidden');
      }

      // Container Options / Inputs
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      if (q.type === 'mcq') {
        q.options.forEach((optText, i) => {
          const btn = document.createElement('button');
          btn.className = `option-btn w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-950 hover:bg-slate-800/60 transition-all font-medium text-slate-200 text-sm md:text-base flex items-start space-x-3`;
          btn.onclick = () => selectMcqOption(i);
          btn.id = `opt-${i}`;
          btn.innerHTML = `
            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-800 text-xs text-sky-400 font-bold shrink-0 mt-0.5">${i + 1}</span>
            <span class="flex-1">${optText.substring(2)}</span>
          `;
          optionsContainer.appendChild(btn);
        });
      } else {
        // Subjective Multi/Single Blank Rendering
        q.answers.forEach((ans, i) => {
          const fieldWrapper = document.createElement('div');
          fieldWrapper.className = 'space-y-1.5 mb-3';
          
          const label = document.createElement('label');
          label.className = 'block text-xs font-semibold text-slate-400';
          label.innerText = q.labels ? q.labels[i] : `답안 입력 ${i + 1}`;

          const input = document.createElement('input');
          input.type = 'text';
          input.id = `sub-input-${i}`;
          input.className = 'w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 focus:outline-none focus:border-sky-500 font-medium text-base';
          input.placeholder = '정답을 입력하세요 (예: 0.2)';

          fieldWrapper.appendChild(label);
          fieldWrapper.appendChild(input);
          optionsContainer.appendChild(fieldWrapper);
        });
      }
    }

    function selectMcqOption(optIdx) {
      if (isSubmitted) return;
      userAnswers[currentIdx] = optIdx;
      
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        if (idx === optIdx) {
          btn.classList.add('border-sky-500', 'bg-sky-950/40', 'ring-1', 'ring-sky-500');
          btn.classList.remove('bg-slate-950');
        } else {
          btn.classList.remove('border-sky-500', 'bg-sky-950/40', 'ring-1', 'ring-sky-500');
          btn.classList.add('bg-slate-950');
        }
      });
    }

    function submitAnswer() {
      const q = quizData[currentIdx];
      let isCorrect = false;
      let userAnsFormatted = '';

      if (q.type === 'mcq') {
        if (userAnswers[currentIdx] === undefined) {
          alert('정답을 선택해 주세요!');
          return;
        }
        isCorrect = (userAnswers[currentIdx] === q.answer);
        userAnsFormatted = `${userAnswers[currentIdx] + 1}번 보기`;
      } else {
        const userInputs = [];
        let allFilled = true;
        
        q.answers.forEach((_, i) => {
          const val = document.getElementById(`sub-input-${i}`).value.trim();
          if (!val) allFilled = false;
          userInputs.push(val);
        });

        if (!allFilled) {
          alert('모든 정답 입력 칸을 채워주세요!');
          return;
        }

        userAnswers[currentIdx] = userInputs;
        userAnsFormatted = userInputs.join(', ');

        // Check exact or normalized answer
        isCorrect = q.answers.every((ans, i) => {
          const target = ans.trim().replaceAll(' ', '');
          const input = userInputs[i].trim().replaceAll(' ', '');
          return target === input;
        });
      }

      isSubmitted = true;
      document.getElementById('submit-btn').classList.add('hidden');

      // Display Feedback
      const expCard = document.getElementById('explanation-card');
      const fbHeader = document.getElementById('feedback-header');
      const fbIcon = document.getElementById('feedback-icon');
      const fbTitle = document.getElementById('feedback-title');
      const fbSubtitle = document.getElementById('feedback-subtitle');

      if (isCorrect) {
        fbHeader.className = 'flex items-center space-x-3 p-4 rounded-xl mb-6 bg-emerald-950/60 border border-emerald-800/60 text-emerald-300';
        fbIcon.className = 'text-2xl fa-solid fa-circle-check text-emerald-400';
        fbTitle.innerText = '정답입니다! 완벽한 조문 암기입니다.';
        fbSubtitle.innerText = '출제 포인트를 완전히 파악하셨습니다.';
      } else {
        fbHeader.className = 'flex items-center space-x-3 p-4 rounded-xl mb-6 bg-rose-950/60 border border-rose-800/60 text-rose-300';
        fbIcon.className = 'text-2xl fa-solid fa-circle-xmark text-rose-400';
        fbTitle.innerText = '아쉽게 오답입니다.';
        fbSubtitle.innerText = `선택하신 답: ${userAnsFormatted}`;
      }

      // Display Correct Answer Text
      if (q.type === 'mcq') {
        document.getElementById('correct-answer-text').innerText = `정답: ④번 (${q.options[q.answer]})`;
      } else {
        document.getElementById('correct-answer-text').innerText = `정답: ${q.answers.join(', ')}`;
      }

      // Render Detailed Explanation
      document.getElementById('exp-summary').innerText = q.explanation.summary;
      document.getElementById('exp-legal').innerText = q.explanation.legalBasis;
      document.getElementById('exp-detail').innerHTML = q.explanation.detail;

      expCard.classList.remove('hidden');
      expCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function nextQuestion() {
      if (currentIdx < quizData.length - 1) {
        currentIdx++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-view').classList.add('hidden');
      document.getElementById('quiz-badge-container').classList.add('hidden');
      document.getElementById('summary-view').classList.remove('hidden');

      // Calculate Total Score (40 questions, 2.5 points each = 100 points max)
      let correctCount = 0;
      const wrongList = [];

      quizData.forEach((q, idx) => {
        let isCorrect = false;
        if (q.type === 'mcq') {
          isCorrect = (userAnswers[idx] === q.answer);
        } else {
          const userInputs = userAnswers[idx] || [];
          isCorrect = q.answers.every((ans, i) => {
            const target = ans.trim().replaceAll(' ', '');
            const input = (userInputs[i] || '').trim().replaceAll(' ', '');
            return target === input;
          });
        }

        if (isCorrect) {
          correctCount++;
        } else {
          wrongList.push({ ...q, userAns: userAnswers[idx] });
        }
      });

      const finalScore = (correctCount / quizData.length) * 100;
      document.getElementById('final-score').innerText = finalScore.toFixed(0);

      // Score Comments
      const commentEl = document.getElementById('score-comment');
      if (finalScore >= 80) {
        commentEl.innerText = '🎉 압도적 고득점! 2차 시험 수석 합격권입니다.';
        commentEl.className = 'text-emerald-400 font-bold mb-6';
      } else if (finalScore >= 60) {
        commentEl.innerText = '👍 합격 안정권입니다! 틀린 지문만 오답노트로 복습하세요.';
        commentEl.className = 'text-sky-400 font-bold mb-6';
      } else {
        commentEl.innerText = '💡 약점 보완이 필요합니다. 아래 오답노트를 집중적으로 회독하세요.';
        commentEl.className = 'text-amber-400 font-bold mb-6';
      }

      // Render Incorrect Notes Table
      const wrongContainer = document.getElementById('incorrect-list');
      wrongContainer.innerHTML = '';

      document.getElementById('wrong-count-tag').innerText = `틀린 문제: ${wrongList.length}개`;

      if (wrongList.length === 0) {
        wrongContainer.innerHTML = '<div class="p-8 text-center text-emerald-400 font-bold">축하합니다! 모든 문제를 맞히셨습니다.</div>';
        return;
      }

      wrongList.forEach((q) => {
        const item = document.createElement('div');
        item.className = 'p-5 bg-slate-950 border border-slate-800 rounded-xl space-y-3';
        
        let correctTxt = q.type === 'mcq' ? `${q.answer + 1}번` : q.answers.join(', ');
        let userTxt = '';
        if (q.type === 'mcq') {
          userTxt = q.userAns !== undefined ? `${q.userAns + 1}번` : '미선택';
        } else {
          userTxt = Array.isArray(q.userAns) ? q.userAns.join(', ') : '미입력';
        }

        item.innerHTML = `
          <div class="flex items-center justify-between text-xs text-slate-400">
            <span class="font-bold text-sky-400">문제 ${q.id}번 (${q.type === 'mcq' ? '객관식' : '주관식'})</span>
            <span>${q.chapter}</span>
          </div>
          <p class="font-bold text-sm text-slate-200">${q.question}</p>
          <div class="flex items-center space-x-4 text-xs font-mono bg-slate-900 p-3 rounded-lg border border-slate-800">
            <span class="text-rose-400">나의 답: ${userTxt}</span>
            <span class="text-emerald-400">정답: ${correctTxt}</span>
          </div>
          <p class="text-xs text-slate-300 leading-relaxed bg-slate-900/50 p-3 rounded-lg">
            <strong class="text-sky-400">💡 핵심 포인트:</strong> ${q.explanation.summary}
          </p>
        `;
        wrongContainer.appendChild(item);
      });
    }

    // Restart Quiz
    function restartQuiz() {
      currentIdx = 0;
      userAnswers = {};
      isSubmitted = false;
      document.getElementById('summary-view').classList.add('hidden');
      document.getElementById('quiz-view').classList.remove('hidden');
      document.getElementById('quiz-badge-container').classList.remove('hidden');
      renderQuestion();
    }
  </script>
</body>
</html>
