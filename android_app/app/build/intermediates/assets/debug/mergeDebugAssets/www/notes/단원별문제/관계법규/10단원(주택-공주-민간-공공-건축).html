                explanation: "영업정지에 갈음하여 부과하는 행정처분 금전벌은 '과징금'이며 최고 한도는 '2000만원'입니다 (공동주택관리법 제54조).",
                keyword: "㉠ 2000, ㉡ 과징금"
            }
        ];

        let currentIndex = 0;
        let userAnswers = {}; // id -> { userAns, isCorrect, submitted }
        let isDrawerOpen = false;

        window.onload = function() {
            renderQuestion(currentIndex);
            updateProgressBar();
            buildDrawerGrids();
        };

        function toggleDrawer() {
            const drawer = document.getElementById('drawer-panel');
            const backdrop = document.getElementById('drawer-backdrop');
            
            if (isDrawerOpen) {
                drawer.classList.add('translate-x-full');
                backdrop.classList.add('opacity-0');
                setTimeout(() => backdrop.classList.add('hidden'), 300);
                isDrawerOpen = false;
            } else {
                updateDrawerGrids();
                backdrop.classList.remove('hidden');
                setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
                drawer.classList.remove('translate-x-full');
                isDrawerOpen = true;
            }
        }

        function buildDrawerGrids() {
            const gridObj = document.getElementById('grid-objective');
            const gridSub = document.getElementById('grid-subjective');
            gridObj.innerHTML = '';
            gridSub.innerHTML = '';

            examData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.id = `drawer-btn-${idx}`;
                btn.className = `h-9 text-xs font-bold rounded-lg border transition flex items-center justify-center bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700`;
                btn.innerText = q.id;
                btn.onclick = () => {
                    jumpToQuestion(idx);
                    toggleDrawer();
                };

                if (idx < 24) {
                    gridObj.appendChild(btn);
                } else {
                    gridSub.appendChild(btn);
                }
            });
        }

        function updateDrawerGrids() {
            examData.forEach((q, idx) => {
                const btn = document.getElementById(`drawer-btn-${idx}`);
                if (!btn) return;

                const ansState = userAnswers[q.id];
                btn.className = "h-9 text-xs font-bold rounded-lg border transition flex items-center justify-center ";

                if (idx === currentIndex) {
                    btn.className += "ring-2 ring-sky-400 border-sky-500 font-extrabold ";
                }

                if (!ansState || !ansState.submitted) {
                    btn.className += "bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700";
                } else if (ansState.isCorrect) {
                    btn.className += "bg-emerald-950/80 border-emerald-600 text-emerald-300";
                } else {
                    btn.className += "bg-rose-950/80 border-rose-600 text-rose-300";
                }
            });
        }

        function updateProgressBar() {
            const total = examData.length;
            const currentNum = currentIndex + 1;
            const submittedCount = Object.values(userAnswers).filter(a => a.submitted).length;

            document.getElementById('progress-text').innerText = `진행률: ${currentNum} / ${total} 문제 (단원: ${examData[currentIndex].subject})`;
            document.getElementById('score-live').innerText = `제출 완료: ${submittedCount} / ${total}개`;

            const percentage = (currentNum / total) * 100;
            document.getElementById('progress-bar-fill').style.width = `${percentage}%`;
        }

        function renderQuestion(index) {
            const container = document.getElementById('exam-card-container');
            const q = examData[index];
            const state = userAnswers[q.id] || { submitted: false };

            let html = `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-7 shadow-xl space-y-6">
                    <!-- Top Badge Row -->
                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-4">
                        <div class="flex items-center space-x-2">
                            <span class="px-2.5 py-1 text-xs font-extrabold rounded-md bg-sky-900/60 text-sky-300 border border-sky-700">
                                ${q.subject}
                            </span>
                            <span class="px-2.5 py-1 text-xs font-bold rounded-md bg-slate-800 text-slate-300 border border-slate-700">
                                ${q.type === 'objective' ? '객관식 (5지선다)' : '주관식 단답형'}
                            </span>
                        </div>
                        <span class="text-xs font-bold text-slate-400">
                            문제 ID: #${q.id} / 40
                        </span>
                    </div>

                    <!-- Question Tip / Focus -->
                    <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-3.5 text-xs text-sky-200 flex items-start space-x-2.5">
                        <i class="fa-solid fa-lightbulb text-amber-400 text-sm mt-0.5"></i>
                        <div>
                            <span class="font-bold text-amber-300">일타강사의 핵심 포인트:</span> ${q.tip}
                        </div>
                    </div>

                    <!-- Question Text -->
                    <div class="text-slate-100 font-semibold text-base sm:text-lg leading-relaxed whitespace-pre-line">
                        ${q.question}
                    </div>
            `;

            if (q.type === 'objective') {
                html += `<div class="space-y-3 pt-2">`;
                q.options.forEach((opt, optIdx) => {
                    let btnClass = "w-full text-left p-4 rounded-xl text-sm font-medium border transition-all duration-200 flex items-center justify-between ";
                    
                    if (!state.submitted) {
                        btnClass += "bg-slate-800/80 border-slate-700/80 hover:bg-slate-700 hover:border-slate-600 text-slate-200 cursor-pointer";
                    } else {
                        if (optIdx === q.answer) {
                            btnClass += "bg-emerald-950/70 border-emerald-500 text-emerald-200 font-bold ring-1 ring-emerald-500";
                        } else if (state.userAns === optIdx) {
                            btnClass += "bg-rose-950/70 border-rose-500 text-rose-200 font-bold ring-1 ring-rose-500";
                        } else {
                            btnClass += "bg-slate-900/50 border-slate-800 text-slate-500 opacity-60";
                        }
                    }

                    const isChecked = state.userAns === optIdx;
                    html += `
                        <button onclick="selectObjectiveOption(${optIdx})" ${state.submitted ? 'disabled' : ''} class="${btnClass}">
                            <span>${opt}</span>
                            ${state.submitted && optIdx === q.answer ? '<i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>' : ''}
                            ${state.submitted && isChecked && optIdx !== q.answer ? '<i class="fa-solid fa-circle-xmark text-rose-400 text-lg"></i>' : ''}
                        </button>
                    `;
                });
                html += `</div>`;
            } else {
                // Subjective render
                html += `<div class="space-y-4 pt-2">`;
                q.blanks.forEach((blank, bIdx) => {
                    const currentVal = state.userAns ? (state.userAns[bIdx] || '') : '';
                    html += `
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold text-slate-300">빈칸 (${blank.label}) 정답 입력:</label>
                            <input type="text" id="blank-input-${bIdx}" value="${currentVal}" ${state.submitted ? 'disabled' : ''}
                                placeholder="빈칸 ${blank.label}에 들어갈 정답 입력" 
                                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 disabled:opacity-80 font-medium">
                        </div>
                    `;
                });
                
                if (!state.submitted) {
                    html += `
                        <button onclick="submitSubjectiveAnswer()" class="w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm rounded-xl transition shadow-lg mt-2">
                            <i class="fa-solid fa-paper-plane mr-2"></i> 정답 채점하기
                        </button>
                    `;
                }
                html += `</div>`;
            }

            // Explanation & Result Card (Shown after submission)
            if (state.submitted) {
                const isCorrect = state.isCorrect;
                html += `
                    <div class="mt-6 border-t border-slate-800 pt-6 space-y-4">
                        <!-- Result Banner -->
                        <div class="p-4 rounded-xl border flex items-center justify-between ${isCorrect ? 'bg-emerald-950/60 border-emerald-600 text-emerald-200' : 'bg-rose-950/60 border-rose-600 text-rose-200'}">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-400' : 'fa-circle-xmark text-rose-400'} text-2xl"></i>
                                <div>
                                    <div class="font-bold text-base">${isCorrect ? '정답입니다! 완벽한 조문 숙지입니다.' : '오답입니다. 정밀 해설을 확인하세요.'}</div>
                                    <div class="text-xs opacity-90">핵심 조문키워드: <span class="font-bold underline">${q.keyword}</span></div>
                                </div>
                            </div>
                        </div>

                        <!-- Full Explanation -->
                        <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-5 space-y-3">
                            <h4 class="text-xs font-bold text-sky-400 uppercase tracking-wider flex items-center">
                                <i class="fa-solid fa-book-bookmark mr-2"></i> 일타강사 입체해설 및 법적 근거
                            </h4>
                            <p class="text-sm text-slate-200 leading-relaxed font-normal">
                                ${q.explanation}
                            </p>
                        </div>
                    </div>
                `;
            }

            // Bottom Navigation Buttons
            html += `
                <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                    <button onclick="prevQuestion()" ${index === 0 ? 'disabled' : ''} class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl border border-slate-700 disabled:opacity-40 transition flex items-center">
                        <i class="fa-solid fa-arrow-left mr-2"></i> 이전 문제
                    </button>
                    
                    <span class="text-xs font-bold text-slate-400">${index + 1} / 40</span>

                    ${index < examData.length - 1 ? `
                        <button onclick="nextQuestion()" class="px-5 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center">
                            다음 문제 <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    ` : `
                        <button onclick="finishExam()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center">
                            최종 제출 및 성적표 <i class="fa-solid fa-flag-checkered ml-2"></i>
                        </button>
                    `}
                </div>
            </div>`;

            container.innerHTML = html;
            updateProgressBar();
        }

        function selectObjectiveOption(optIdx) {
            const q = examData[currentIndex];
            const isCorrect = (optIdx === q.answer);

            userAnswers[q.id] = {
                userAns: optIdx,
                isCorrect: isCorrect,
                submitted: true
            };

            renderQuestion(currentIndex);
        }

        function submitSubjectiveAnswer() {
            const q = examData[currentIndex];
            let userAnsArr = [];
            let allCorrect = true;

            q.blanks.forEach((blank, bIdx) => {
                const input = document.getElementById(`blank-input-${bIdx}`);
                const val = input ? input.value.trim() : '';
                userAnsArr.push(val);

                // Check acceptance
                const cleanVal = val.replace(/\s+/g, '').toLowerCase();
                const isBlankCorrect = blank.accepts.some(acc => acc.replace(/\s+/g, '').toLowerCase() === cleanVal);
                if (!isBlankCorrect) {
                    allCorrect = false;
                }
            });

            userAnswers[q.id] = {
                userAns: userAnsArr,
                isCorrect: allCorrect,
                submitted: true
            };

            renderQuestion(currentIndex);
        }

        function nextQuestion() {
            if (currentIndex < examData.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        }

        function jumpToQuestion(idx) {
            currentIndex = idx;
            renderQuestion(currentIndex);
        }

        function resetExamConfirm() {
            if (confirm("정말로 처음부터 다시 시작하시겠습니까? 작성한 답안이 모두 초기화됩니다.")) {
                userAnswers = {};
                currentIndex = 0;
                document.getElementById('result-container').classList.add('hidden');
                document.getElementById('exam-card-container').classList.remove('hidden');
                document.getElementById('progress-bar-container').classList.remove('hidden');
                renderQuestion(currentIndex);
            }
        }

        function finishExam() {
            // Check unsubmitted
            const total = examData.length;
            const submittedCount = Object.values(userAnswers).filter(a => a.submitted).length;

            if (submittedCount < total) {
                if (!confirm(`총 40문제 중 ${total - submittedCount}문제가 미제출 상태입니다. 그대로 채점하시겠습니까?`)) {
                    return;
                }
            }

            let correctCount = 0;
            let score = 0;
            let wrongItems = [];

            examData.forEach(q => {
                const state = userAnswers[q.id];
                if (state && state.submitted && state.isCorrect) {
                    correctCount++;
                } else {
                    wrongItems.push({
                        q: q,
                        userAns: state ? state.userAns : null
                    });
                }
            });

            score = correctCount * 2.5; // 40 questions = 100 points total

            document.getElementById('exam-card-container').classList.add('hidden');
            document.getElementById('progress-bar-container').classList.add('hidden');

            const resultContainer = document.getElementById('result-container');
            resultContainer.classList.remove('hidden');

            const isPass = score >= 60;

            let wrongHtml = '';
            if (wrongItems.length === 0) {
                wrongHtml = `
                    <div class="p-6 bg-emerald-950/40 border border-emerald-600/60 rounded-xl text-center text-emerald-300">
                        <i class="fa-solid fa-trophy text-4xl mb-2 text-amber-400"></i>
                        <h4 class="font-bold text-lg">축하합니다! 40문항 전파 만점입니다.</h4>
                        <p class="text-xs text-slate-300 mt-1">2차 관계법규 시험 고득점 합격을 확신합니다!</p>
                    </div>
                `;
            } else {
                wrongHtml = wrongItems.map((item, idx) => {
                    const q = item.q;
                    let displayUserAns = "미응답";
                    if (item.userAns !== null && item.userAns !== undefined) {
                        if (q.type === 'objective') {
                            displayUserAns = q.options[item.userAns];
                        } else {
                            displayUserAns = item.userAns.join(', ');
                        }
                    }

                    let correctDisplay = '';
                    if (q.type === 'objective') {
                        correctDisplay = q.options[q.answer];
                    } else {
                        correctDisplay = q.blanks.map(b => `${b.label} ${b.displayAns}`).join(', ');
                    }

                    return `
                        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2 text-xs">
                            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                <span class="font-bold text-sky-400">문제 ${q.id}번 [${q.subject}]</span>
                                <span class="px-2 py-0.5 rounded bg-rose-900/60 text-rose-300 border border-rose-700/60 font-semibold">오답</span>
                            </div>
                            <div class="text-slate-200 font-medium">${q.question}</div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1 text-slate-400">
                                <div class="bg-slate-950 p-2 rounded border border-slate-800/80">
                                    <span class="text-rose-400 font-bold">내가 낸 답:</span> ${displayUserAns || '미입력'}
                                </div>
                                <div class="bg-slate-950 p-2 rounded border border-slate-800/80">
                                    <span class="text-emerald-400 font-bold">정답:</span> ${correctDisplay}
                                </div>
                            </div>
                            <div class="bg-slate-800/40 p-2.5 rounded text-slate-300 leading-relaxed mt-2 border border-slate-700/40">
                                <span class="font-bold text-amber-300"><i class="fa-solid fa-key mr-1"></i> 핵심 법조문 해설:</span> ${q.explanation}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            resultContainer.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
                    <!-- Top Result Card Header -->
                    <div class="text-center space-y-3 border-b border-slate-800 pb-6">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full ${isPass ? 'bg-emerald-900/50 text-emerald-400 ring-4 ring-emerald-500/30' : 'bg-rose-900/50 text-rose-400 ring-4 ring-rose-500/30'}">
                            <i class="fa-solid ${isPass ? 'fa-award' : 'fa-triangle-exclamation'} text-3xl"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-slate-100">
                            ${isPass ? '합격을 축하합니다!' : '조금 더 보완이 필요합니다.'}
                        </h2>
                        <p class="text-xs text-slate-400">
                            주택관리사보 2차 관계법규 실전 모의고사 채점 결과 보고서
                        </p>
                    </div>

                    <!-- Score Grid -->
                    <div class="grid grid-cols-3 gap-3 text-center">
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <div class="text-xs text-slate-400 mb-1">최종 점수</div>
                            <div class="text-2xl sm:text-3xl font-black ${isPass ? 'text-emerald-400' : 'text-rose-400'}">${score}점</div>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <div class="text-xs text-slate-400 mb-1">맞힌 개수</div>
                            <div class="text-2xl sm:text-3xl font-black text-sky-400">${correctCount} / 40</div>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <div class="text-xs text-slate-400 mb-1">판정</div>
                            <div class="text-lg sm:text-2xl font-bold mt-1 ${isPass ? 'text-emerald-400' : 'text-rose-400'}">${isPass ? '합격 (60점 이상)' : '불합격'}</div>
                        </div>
                    </div>

                    <!-- Action buttons -->
                    <div class="flex flex-col sm:flex-row gap-3 pt-2">
                        <button onclick="resetExamConfirm()" class="flex-1 py-3 bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm rounded-xl transition shadow-md flex items-center justify-center">
                            <i class="fa-solid fa-rotate-right mr-2"></i> 모의고사 다시 풀기
                        </button>
                    </div>

                    <!-- Wrong Notes Section -->
                    <div class="pt-6 border-t border-slate-800 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-extrabold text-base text-slate-100 flex items-center">
                                <i class="fa-solid fa-note-sticky text-amber-400 mr-2"></i> 일타강사의 약점 보완 오답노트
                            </h3>
                            <span class="text-xs text-slate-400">오답: ${wrongItems.length}개</span>
                        </div>
                        <div class="space-y-3">
                            ${wrongHtml}
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
