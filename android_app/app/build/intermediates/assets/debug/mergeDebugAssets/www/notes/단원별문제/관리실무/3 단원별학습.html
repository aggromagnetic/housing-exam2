    <script>
        let soundEnabled = true;
        const synth = new Tone.Synth().toDestination();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }
                if (type === 'correct') {
                    const now = Tone.now();
                    synth.triggerAttackRelease("E5", "8n", now);
                    synth.triggerAttackRelease("G5", "8n", now + 0.1);
                    synth.triggerAttackRelease("C6", "4n", now + 0.2);
                } else if (type === 'incorrect') {
                    const now = Tone.now();
                    synth.triggerAttackRelease("G3", "8n", now);
                    synth.triggerAttackRelease("F3", "4n", now + 0.15);
                }
            } catch (error) {
                console.log('사운드 실행 오류:', error);
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toastNotification');
            const toastInner = document.getElementById('toastInner');
            const toastIcon = document.getElementById('toastIcon');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.innerText = message;
            if (type === 'error') {
                toastIcon.className = 'fa-solid fa-triangle-exclamation text-rose-400 text-lg';
                toastInner.className = 'bg-slate-900 text-white border border-rose-500/30 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3';
            } else if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
                toastInner.className = 'bg-slate-900 text-white border border-emerald-500/30 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-sky-400 text-lg';
                toastInner.className = 'bg-slate-900 text-white border border-slate-700 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3';
            }

            toast.classList.remove('-translate-y-20', 'opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                toast.classList.add('-translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('customConfirmModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const cancelBtn = document.getElementById('modalCancelBtn');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            modalTitle.innerText = title;
            modalMessage.innerText = message;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);

            const closeModal = () => {
                modal.classList.add('opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            };

            cancelBtn.onclick = () => {
                closeModal();
            };

            confirmBtn.onclick = () => {
                closeModal();
                onConfirm();
            };
        }

                correction: "① 임대주택분쟁조정위원회 구성 주체는 '시장·군수·구청장'(기초지자체장)입니다.\n② 성립된 것으로 '본다'(추정한다 X).\n③ 민간임대주택법상 조정 성립은 재판상 화해가 아니라 민사상 합의 성립의 효력만 갖습니다.\n④ 위원장은 회의 개최일 '2일 전'까지 통지해야 합니다(시행령 제45조 제2항).\n⑤ 지자체의 소속 직원 중 1명을 간사로 임명합니다(시행령 제45조 제4항)."
            },
            {
                id: 40,
                chapter: "제7장: 입주자관리",
                type: "subjective",
                question: "민간임대주택에 관한 특별법 제55조(임대주택분쟁조정위원회)에 관한 규정이다. ( )에 들어갈 숫자를 쓰시오.",
                box: "조정위원회는 위원장 1명을 포함하여 ( ㉡ )명 이내로 구성하되, 운영·절차 등에 필요한 사항은 대통령령으로 정한다.",
                inputs: ["㉡"],
                answer: ["10"],
                explanation: "임대주택분쟁조정위원회 위원 수 한도는 10명 이내입니다.",
                correction: "위원 한도 = 10명 이내"
            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = {};
        let isAnswerSubmitted = false;

        const chapterBadge = document.getElementById('chapterBadge');
        const questionProgressText = document.getElementById('questionProgressText');
        const progressBar = document.getElementById('progressBar');
        const questionNumber = document.getElementById('questionNumber');
        const questionTitle = document.getElementById('questionTitle');
        const questionBox = document.getElementById('questionBox');
        const multipleChoiceArea = document.getElementById('multipleChoiceArea');
        const subjectiveChoiceArea = document.getElementById('subjectiveChoiceArea');
        const subjectiveInputsContainer = document.getElementById('subjectiveInputsContainer');
        const feedbackArea = document.getElementById('feedbackArea');
        const feedbackBadge = document.getElementById('feedbackBadge');
        const explanationText = document.getElementById('explanationText');
        const correctionText = document.getElementById('correctionText');
        const submitAnswerBtn = document.getElementById('submitAnswerBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const headerScore = document.getElementById('headerScore');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const endExamEarlyBtn = document.getElementById('endExamEarlyBtn');
        const finalReportModal = document.getElementById('finalReportModal');
        const finalScore = document.getElementById('finalScore');
        const finalCorrectCount = document.getElementById('finalCorrectCount');
        const finalPassBadge = document.getElementById('finalPassBadge');
        const incorrectNoteText = document.getElementById('incorrectNoteText');
        const copyIncorrectBtn = document.getElementById('copyIncorrectBtn');
        const retryExamBtn = document.getElementById('retryExamBtn');

        function initQuiz() {
            currentQuestionIndex = 0;
            userAnswers = {};
            finalReportModal.classList.add('hidden', 'opacity-0');
            renderQuestion();
            updateHeaderStats();
        }

        function renderQuestion() {
            const q = quizData[currentQuestionIndex];
            isAnswerSubmitted = !!userAnswers[q.id];

            chapterBadge.innerText = q.chapter;
            questionProgressText.innerText = `문제 ${currentQuestionIndex + 1} / ${quizData.length}`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;

            questionNumber.innerText = `Q${q.id}.`;
            questionTitle.innerText = q.question;

            if (q.box) {
                questionBox.innerText = q.box;
                questionBox.classList.remove('hidden');
            } else {
                questionBox.classList.add('hidden');
            }

            multipleChoiceArea.innerHTML = '';
            subjectiveInputsContainer.innerHTML = '';

            if (q.type === 'multiple') {
                multipleChoiceArea.classList.remove('hidden');
                subjectiveChoiceArea.classList.add('hidden');

                const circleNums = ['①', '②', '③', '④', '⑤'];
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    const numIdx = idx + 1;
                    btn.className = 'w-full text-left p-3.5 sm:p-4 rounded-xl border border-slate-800 bg-slate-950/40 hover:bg-slate-800/60 transition-all flex items-start space-x-3 text-xs sm:text-sm text-slate-300';
                    btn.dataset.index = numIdx;

                    btn.innerHTML = `
                        <span class="font-bold text-emerald-400 shrink-0">${circleNums[idx]}</span>
                        <span class="leading-relaxed flex-grow">${opt}</span>
                    `;

                    if (isAnswerSubmitted) {
                        btn.disabled = true;
                        const userAns = userAnswers[q.id].userResponse;
                        if (numIdx === q.answer) {
                            btn.className = 'w-full text-left p-3.5 sm:p-4 rounded-xl border-2 border-emerald-500 bg-emerald-500/10 text-white font-semibold transition-all flex items-start space-x-3 text-xs sm:text-sm';
                        } else if (numIdx === userAns) {
                            btn.className = 'w-full text-left p-3.5 sm:p-4 rounded-xl border-2 border-rose-500 bg-rose-500/10 text-white transition-all flex items-start space-x-3 text-xs sm:text-sm';
                        }
                    } else {
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('#multipleChoiceArea button').forEach(b => {
                                b.classList.remove('border-emerald-500', 'bg-emerald-500/10', 'text-white');
                                b.classList.add('border-slate-800', 'bg-slate-950/40', 'text-slate-300');
                            });
                            btn.classList.remove('border-slate-800', 'bg-slate-950/40', 'text-slate-300');
                            btn.classList.add('border-emerald-500', 'bg-emerald-500/10', 'text-white');
                        });
                    }

                    multipleChoiceArea.appendChild(btn);
                });
            } else {
                multipleChoiceArea.classList.add('hidden');
                subjectiveChoiceArea.classList.remove('hidden');

                q.inputs.forEach((label, idx) => {
                    const wrap = document.createElement('div');
                    wrap.className = 'space-y-1.5';
                    wrap.innerHTML = `
                        <label class="text-xs font-semibold text-slate-400">[ ${label} ] 정답 입력</label>
                        <input type="text" id="subInput_${idx}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition-all" placeholder="정답을 입력하세요" ${isAnswerSubmitted ? 'disabled' : ''}>
                    `;
                    subjectiveInputsContainer.appendChild(wrap);

                    if (isAnswerSubmitted) {
                        const inputEl = wrap.querySelector('input');
                        if (userAnswers[q.id].userResponse && userAnswers[q.id].userResponse[idx] !== undefined) {
                            inputEl.value = userAnswers[q.id].userResponse[idx];
                        }
                    }
                });
            }

            if (isAnswerSubmitted) {
                showFeedback(userAnswers[q.id].isCorrect, q, userAnswers[q.id].answerText);
                submitAnswerBtn.disabled = true;
                submitAnswerBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                feedbackArea.classList.add('hidden');
                submitAnswerBtn.disabled = false;
                submitAnswerBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            prevBtn.disabled = (currentQuestionIndex === 0);
            nextBtn.disabled = (currentQuestionIndex === quizData.length - 1);
        }

        function evaluateAnswer() {
            if (isAnswerSubmitted) return;

            const q = quizData[currentQuestionIndex];
            let isCorrect = false;
            let userResponse = null;
            let answerText = "";

            if (q.type === "multiple") {
                const selectedOptBtn = document.querySelector('#multipleChoiceArea button.border-emerald-500');
                if (!selectedOptBtn) {
                    showToast('보기를 먼저 선택해 주세요!', 'error');
                    return;
                }
                const userChoice = parseInt(selectedOptBtn.dataset.index);
                isCorrect = (userChoice === q.answer);
                userResponse = userChoice;
                answerText = ["①", "②", "③", "④", "⑤"][q.answer - 1] + " " + q.options[q.answer - 1];
            } else {
                const inputs = document.querySelectorAll('#subjectiveInputsContainer input');
                let allFilled = true;
                const userAnswersArr = [];

                inputs.forEach(input => {
                    const val = input.value.trim().replace(/\s+/g, '');
                    if (!val) allFilled = false;
                    userAnswersArr.push(val);
                });

                if (!allFilled) {
                    showToast('모든 빈칸에 정답을 채워 주세요!', 'error');
                    return;
                }

                isCorrect = q.answer.every((ans, idx) => {
                    const formattedAns = ans.trim().replace(/\s+/g, '');
                    return userAnswersArr[idx] === formattedAns;
                });

                userResponse = userAnswersArr;
                answerText = q.inputs.map((lbl, idx) => `${lbl} -> [${q.answer[idx]}]`).join(', ');
            }

            userAnswers[q.id] = {
                isCorrect,
                userResponse,
                answerText
            };

            isAnswerSubmitted = true;
            submitAnswerBtn.disabled = true;
            submitAnswerBtn.classList.add('opacity-50', 'cursor-not-allowed');

            if (isCorrect) {
                playSound('correct');
            } else {
                playSound('incorrect');
            }

            renderQuestion();
            updateHeaderStats();
        }

        function showFeedback(isCorrect, q, answerText) {
            feedbackArea.classList.remove('hidden');
            if (isCorrect) {
                feedbackBadge.className = 'p-3.5 rounded-xl flex items-center space-x-3 text-sm font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
                feedbackBadge.innerHTML = `<i class="fa-solid fa-circle-check text-xl"></i><span>정답입니다! 완벽한 개념 체득입니다. (정답: ${answerText})</span>`;
            } else {
                feedbackBadge.className = 'p-3.5 rounded-xl flex items-center space-x-3 text-sm font-bold bg-rose-500/10 text-rose-400 border border-rose-500/30';
                feedbackBadge.innerHTML = `<i class="fa-solid fa-circle-xmark text-xl"></i><span>아쉽게 틀렸습니다! (정답: ${answerText})</span>`;
            }

            explanationText.innerText = q.explanation;
            correctionText.innerText = q.correction;
        }

        function updateHeaderStats() {
            const answeredIds = Object.keys(userAnswers);
            const totalAnswered = answeredIds.length;
            const correctCount = answeredIds.filter(id => userAnswers[id].isCorrect).length;
            const score = totalAnswered > 0 ? Math.round((correctCount / quizData.length) * 100) : 0;

            headerScore.innerText = `${score}점 (${correctCount}/${totalAnswered})`;
        }

        function showFinalReport() {
            const answeredIds = Object.keys(userAnswers);
            const correctCount = answeredIds.filter(id => userAnswers[id].isCorrect).length;
            const score = Math.round((correctCount / quizData.length) * 100);

            finalScore.innerText = `${score}점`;
            finalCorrectCount.innerText = `${correctCount} / ${quizData.length}`;

            if (score >= 60) {
                finalPassBadge.innerText = '합격권 (우수)';
                finalPassBadge.className = 'text-sm font-bold text-emerald-400 py-1';
            } else {
                finalPassBadge.innerText = '보강 필요';
                finalPassBadge.className = 'text-sm font-bold text-rose-400 py-1';
            }

            let summaryText = `[주택관리사보 2차 모의고사 오답노트 요약]\n시험일자: ${new Date().toLocaleDateString()}\n최종점수: ${score}점 (${correctCount}/${quizData.length})\n-------------------------------\n`;

            let incorrectIdx = 1;
            quizData.forEach(q => {
                const u = userAnswers[q.id];
                if (!u || !u.isCorrect) {
                    summaryText += `\n[오답 ${incorrectIdx++}] Q${q.id}. ${q.question}\n`;
                    summaryText += `- 정답: ${u ? u.answerText : '미응답'}\n`;
                    summaryText += `- 오답교정: ${q.correction.replace(/\n/g, ' ')}\n`;
                }
            });

            incorrectNoteText.innerText = summaryText;

            finalReportModal.classList.remove('hidden');
            setTimeout(() => {
                finalReportModal.classList.remove('opacity-0');
            }, 10);
        }

        submitAnswerBtn.addEventListener('click', evaluateAnswer);

        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showFinalReport();
            }
        });

        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = "fa-solid fa-volume-high text-emerald-400";
                soundToggleBtn.querySelector('span').innerText = "효과음 On";
                showToast("효과음이 켜졌습니다.", "success");
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-slate-500";
                soundToggleBtn.querySelector('span').innerText = "효과음 Off";
                showToast("효과음이 꺼졌습니다.", "info");
            }
        });

        endExamEarlyBtn.addEventListener('click', () => {
            showConfirmModal(
                "학습 조기 종료",
                "정말로 학습을 조기 종료하고 현재까지 푼 내역으로 성적표를 출력하시겠습니까?",
                () => {
                    showFinalReport();
                }
            );
        });

        copyIncorrectBtn.addEventListener('click', () => {
            const textToCopy = incorrectNoteText.innerText;
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            try {
                document.execCommand('copy');
                showToast("오답노트 원고가 클립보드에 복사되었습니다! Gemini에 붙여넣어 활용해 보세요.", "success");
            } catch (err) {
                showToast("복사에 실패했습니다. 마우스로 직접 드래그하여 복사해 주세요.", "error");
            }
            document.body.removeChild(tempTextArea);
        });

        retryExamBtn.addEventListener('click', () => {
            showConfirmModal(
                "처음부터 다시 도전",
                "정말로 성적을 초기화하고 처음부터 다시 문제를 푸시겠습니까?",
                () => {
                    initQuiz();
                    showToast("학습 상태가 초기화되었습니다.", "info");
                }
            );
        });

        window.onload = () => {
            initQuiz();
        };
    </script>
</body>
</html>
