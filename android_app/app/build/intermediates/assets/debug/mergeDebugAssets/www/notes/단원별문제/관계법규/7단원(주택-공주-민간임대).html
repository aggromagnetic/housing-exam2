        let activeQuestions = [...QUESTIONS_DATA];
        let currentIndex = 0;
        let userAnswers = {}; // Map of questionId -> { isSubmitted, isCorrect, value }
        let isRetryMode = false;

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            initExam();
        });

        function initExam() {
            activeQuestions = [...QUESTIONS_DATA];
            currentIndex = 0;
            userAnswers = {};
            isRetryMode = false;

            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('result-container').classList.add('hidden');

            renderQuestion();
            updatePaletteModal();
        }

        function renderQuestion() {
            const q = activeQuestions[currentIndex];
            if (!q) return;

            // Header labels
            document.getElementById('q-number-badge').textContent = `Q.${String(q.id).padStart(2, '0')}`;
            document.getElementById('q-category-badge').textContent = q.category;
            document.getElementById('q-type-badge').textContent = q.type === 'mcq' ? '객관식' : '주관식';

            // Progress text
            document.getElementById('header-progress').textContent = `${currentIndex + 1} / ${activeQuestions.length}`;
            const progressPct = ((currentIndex + 1) / activeQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;

            // Question title & box
            document.getElementById('q-title').textContent = q.question;
            const boxEl = document.getElementById('q-box');
            if (q.boxText) {
                boxEl.textContent = q.boxText;
                boxEl.classList.remove('hidden');
            } else {
                boxEl.classList.add('hidden');
            }

            // Interactive area rendering
            const area = document.getElementById('q-interactive-area');
            area.innerHTML = '';

            const answerState = userAnswers[q.id];
            const isSubmitted = answerState && answerState.isSubmitted;

            if (q.type === 'mcq') {
                const list = document.createElement('div');
                list.className = 'space-y-3';

                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    
                    let baseClass = 'w-full text-left p-4 rounded-xl border font-medium text-sm sm:text-base transition-all flex items-start space-x-3 ';
                    
                    if (isSubmitted) {
                        if (idx === q.answer) {
                            baseClass += 'bg-emerald-950/60 border-emerald-500/80 text-emerald-200 font-bold';
                        } else if (answerState.userVal === idx) {
                            baseClass += 'bg-rose-950/60 border-rose-500/80 text-rose-200';
                        } else {
                            baseClass += 'bg-slate-950/40 border-slate-800 text-slate-500 opacity-60';
                        }
                    } else {
                        if (answerState && answerState.userVal === idx) {
                            baseClass += 'bg-sky-500/20 border-sky-500 text-sky-200 shadow-md shadow-sky-500/10 ring-1 ring-sky-500';
                        } else {
                            baseClass += 'bg-slate-950/60 border-slate-800/80 text-slate-200 hover:border-slate-700 hover:bg-slate-800/50';
                        }
                    }

                    btn.className = baseClass;
                    btn.onclick = () => {
                        if (isSubmitted) return;
                        selectMcqOption(q.id, idx);
                    };

                    const numSpan = document.createElement('span');
                    numSpan.className = 'w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold text-slate-300 flex-shrink-0 mt-0.5';
                    numSpan.textContent = ['①','②','③','④','⑤'][idx];

                    const textSpan = document.createElement('span');
                    textSpan.className = 'flex-1';
                    textSpan.textContent = opt;

                    btn.appendChild(numSpan);
                    btn.appendChild(textSpan);
                    list.appendChild(btn);
                });

                area.appendChild(list);

            } else {
                // Short answer input
                const wrap = document.createElement('div');
                wrap.className = 'space-y-4 bg-slate-950/40 p-4 rounded-xl border border-slate-800/80';

                q.inputs.forEach((inputDef, idx) => {
                    const fieldGroup = document.createElement('div');
                    fieldGroup.className = 'space-y-1.5';

                    const lbl = document.createElement('label');
                    lbl.className = 'block text-xs font-bold text-sky-400';
                    lbl.textContent = inputDef.label;

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = '정답을 입력하세요';
                    input.className = 'w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 text-sm font-semibold focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition';
                    input.id = `short-input-${q.id}-${idx}`;

                    if (answerState) {
                        const savedVal = answerState.userVal ? answerState.userVal[inputDef.key] : '';
                        input.value = savedVal || '';
                    }

                    if (isSubmitted) {
                        input.disabled = true;
                        input.classList.add('opacity-75');
                    }

                    fieldGroup.appendChild(lbl);
                    fieldGroup.appendChild(input);
                    wrap.appendChild(fieldGroup);
                });

                area.appendChild(wrap);
            }

            // Button visibility
            const btnPrev = document.getElementById('btn-prev');
            btnPrev.disabled = currentIndex === 0;

            const btnSubmit = document.getElementById('btn-submit');
            const btnNext = document.getElementById('btn-next');
            const feedbackBox = document.getElementById('feedback-box');

            if (isSubmitted) {
                btnSubmit.classList.add('hidden');
                btnNext.classList.remove('hidden');

                if (currentIndex === activeQuestions.length - 1) {
                    document.getElementById('btn-next-text').textContent = '결과 및 채점표 보기';
                } else {
                    document.getElementById('btn-next-text').textContent = '다음 문제';
                }

                // Show Feedback
                renderFeedback(q, answerState);
                feedbackBox.classList.remove('hidden');
            } else {
                btnSubmit.classList.remove('hidden');
                btnNext.classList.add('hidden');
                feedbackBox.classList.add('hidden');
            }

            updatePaletteModal();
        }

        // Selection Handler for MCQ
        function selectMcqOption(qId, optionIdx) {
            userAnswers[qId] = {
                isSubmitted: false,
                userVal: optionIdx
            };
            renderQuestion();
        }

        function submitAnswer() {
            const q = activeQuestions[currentIndex];
            let userVal = null;
            let isCorrect = false;

            if (q.type === 'mcq') {
                const currentAns = userAnswers[q.id];
                if (!currentAns || currentAns.userVal === undefined) {
                    showAlertModal('정답 보기를 선택해주세요!');
                    return;
                }
                userVal = currentAns.userVal;
                isCorrect = (userVal === q.answer);

            } else {
                // Short answer collection
                userVal = {};
                let allFilled = true;

                q.inputs.forEach((inputDef, idx) => {
                    const el = document.getElementById(`short-input-${q.id}-${idx}`);
                    const val = el ? el.value.trim() : '';
                    if (!val) allFilled = false;
                    userVal[inputDef.key] = val;
                });

                if (!allFilled) {
                    showAlertModal('모든 빈칸에 답을 입력해 주세요!');
                    return;
                }

                // Verify correctness for all inputs
                let correctCount = 0;
                q.inputs.forEach(inputDef => {
                    const inputVal = (userVal[inputDef.key] || '').replace(/\s+/g, '').toLowerCase();
                    const isMatched = inputDef.acceptable.some(acc => {
                        const cleanAcc = acc.replace(/\s+/g, '').toLowerCase();
                        return inputVal === cleanAcc;
                    });
                    if (isMatched) correctCount++;
                });

                isCorrect = (correctCount === q.inputs.length);
            }

            userAnswers[q.id] = {
                isSubmitted: true,
                isCorrect: isCorrect,
                userVal: userVal
            };

            renderQuestion();
        }

        function renderFeedback(q, answerState) {
            const header = document.getElementById('feedback-header');
            const box = document.getElementById('feedback-box');
            const displayAns = document.getElementById('correct-answer-display');
            const legalText = document.getElementById('legal-basis-text');
            const explDisplay = document.getElementById('explanation-display');

            if (answerState.isCorrect) {
                box.className = 'mt-6 p-5 rounded-xl border transition-all border-emerald-500/40 bg-emerald-950/20';
                header.className = 'flex items-center space-x-2 font-bold text-lg text-emerald-400 mb-3';
                header.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>정답입니다! 훌륭합니다.</span>`;
            } else {
                box.className = 'mt-6 p-5 rounded-xl border transition-all border-rose-500/40 bg-rose-950/20';
                header.className = 'flex items-center space-x-2 font-bold text-lg text-rose-400 mb-3';
                header.innerHTML = `<i class="fa-solid fa-circle-xmark"></i><span>아쉽게 틀렸습니다! 해설을 확인하세요.</span>`;
            }

            if (q.type === 'mcq') {
                const numOpt = ['①','②','③','④','⑤'][q.answer];
                displayAns.innerHTML = `<span class="text-xs text-slate-400 uppercase block">정답</span><span class="text-emerald-400 font-bold">${numOpt} ${q.options[q.answer]}</span>`;
            } else {
                const correctList = q.inputs.map(i => `${i.key}: ${i.acceptable[0]}`).join(' / ');
                displayAns.innerHTML = `<span class="text-xs text-slate-400 uppercase block">정답</span><span class="text-emerald-400 font-bold">${correctList}</span>`;
            }

            legalText.textContent = q.legalBasis;
            explDisplay.textContent = q.explanation;
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentIndex < activeQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                finishExam();
            }
        }

        function finishExam() {
            let correctCount = 0;
            const wrongList = [];

            activeQuestions.forEach(q => {
                const ans = userAnswers[q.id];
                if (ans && ans.isSubmitted && ans.isCorrect) {
                    correctCount++;
                } else {
                    wrongList.push(q);
                }
            });

            // Calculate overall score (100-point scale)
            const scorePerQ = 100 / activeQuestions.length;
            const finalScore = Math.round(correctCount * scorePerQ);

            document.getElementById('final-score').textContent = finalScore;
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('total-count').textContent = activeQuestions.length;

            const passBadge = document.getElementById('pass-fail-badge');
            if (finalScore >= 60) {
                passBadge.textContent = '합격 (Pass)';
                passBadge.className = 'text-2xl font-black text-emerald-400';
            } else {
                passBadge.textContent = '불합격 (Fail)';
                passBadge.className = 'text-2xl font-black text-rose-400';
            }

            // Render Wrong Answers Review List
            renderWrongAnswersReview(wrongList);

            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderWrongAnswersReview(wrongList) {
            const container = document.getElementById('wrong-answers-list');
            const badge = document.getElementById('wrong-count-badge');
            container.innerHTML = '';

            badge.textContent = `오답 ${wrongList.length}개`;

            if (wrongList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-slate-950/40 rounded-xl border border-slate-800 space-y-3">
                        <div class="text-emerald-400 text-4xl"><i class="fa-solid fa-trophy"></i></div>
                        <h4 class="text-lg font-bold text-white">축하합니다! 오답이 없습니다.</h4>
                        <p class="text-sm text-slate-400">모든 문항을 완벽히 마스터하셨습니다. 실전 합격을 기원합니다!</p>
                    </div>
                `;
                document.getElementById('btn-retry-wrong').classList.add('hidden');
                return;
            } else {
                document.getElementById('btn-retry-wrong').classList.remove('hidden');
            }

            wrongList.forEach(q => {
                const userAnsState = userAnswers[q.id] || {};
                const item = document.createElement('div');
                item.className = 'bg-slate-950/60 border border-slate-800/80 rounded-xl p-5 space-y-4 hover:border-slate-700 transition';

                // User input formatting
                let userValText = '미입력';
                if (userAnsState.userVal !== undefined) {
                    if (q.type === 'mcq') {
                        userValText = `선택: ${['①','②','③','④','⑤'][userAnsState.userVal]}`;
                    } else if (typeof userAnsState.userVal === 'object') {
                        userValText = Object.entries(userAnsState.userVal).map(([k,v]) => `${k}:${v||'공란'}`).join(', ');
                    }
                }

                // Correct answer formatting
                let correctValText = '';
                if (q.type === 'mcq') {
                    correctValText = `정답: ${['①','②','③','④','⑤'][q.answer]} ${q.options[q.answer]}`;
                } else {
                    correctValText = `정답: ` + q.inputs.map(i => `${i.key}: ${i.acceptable[0]}`).join(' / ');
                }

                item.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                        <span class="text-xs font-extrabold bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2.5 py-0.5 rounded-lg">
                            Q.${String(q.id).padStart(2, '0')} [${q.category}]
                        </span>
                        <span class="text-xs text-slate-400 font-mono">${q.legalBasis}</span>
                    </div>

                    <div class="text-sm font-bold text-slate-100">${q.question}</div>

                    ${q.boxText ? `<div class="bg-slate-900 p-3 rounded-lg border border-slate-800 text-xs font-mono text-slate-300 whitespace-pre-line border-l-2 border-l-rose-500">${q.boxText}</div>` : ''}

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                        <div class="bg-rose-950/30 border border-rose-900/50 p-2.5 rounded-lg text-rose-300 font-medium">
                            <span class="font-bold block text-rose-400 mb-0.5">내 답안:</span> ${userValText}
                        </div>
                        <div class="bg-emerald-950/30 border border-emerald-900/50 p-2.5 rounded-lg text-emerald-300 font-medium">
                            <span class="font-bold block text-emerald-400 mb-0.5">올바른 정답:</span> ${correctValText}
                        </div>
                    </div>

                    <div class="bg-slate-900/80 p-3.5 rounded-lg border border-slate-800 text-xs text-slate-300 leading-relaxed">
                        <span class="text-sky-400 font-bold block mb-1"><i class="fa-solid fa-lightbulb"></i> 일타강사 핵심 해설:</span>
                        ${q.explanation}
                    </div>
                `;

                container.appendChild(item);
            });
        }

        function retryIncorrectOnly() {
            const wrongQuestions = QUESTIONS_DATA.filter(q => {
                const ans = userAnswers[q.id];
                return !ans || !ans.isSubmitted || !ans.isCorrect;
            });

            if (wrongQuestions.length === 0) return;

            activeQuestions = wrongQuestions;
            currentIndex = 0;
            isRetryMode = true;

            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');

            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function restartFullExam() {
            initExam();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function togglePaletteModal() {
            const modal = document.getElementById('modal-palette');
            if (modal.classList.contains('hidden')) {
                updatePaletteModal();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function updatePaletteModal() {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';

            activeQuestions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';

                const ansState = userAnswers[q.id];
                let bgClass = 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700';

                if (ansState && ansState.isSubmitted) {
                    if (ansState.isCorrect) {
                        bgClass = 'bg-emerald-600 text-white border-emerald-500 font-bold';
                    } else {
                        bgClass = 'bg-rose-600 text-white border-rose-500 font-bold';
                    }
                }

                if (idx === currentIndex) {
                    bgClass += ' ring-2 ring-sky-400 ring-offset-2 ring-offset-slate-900';
                }

                btn.className = `p-2.5 text-xs rounded-xl border transition flex flex-col items-center justify-center font-mono ${bgClass}`;
                btn.textContent = `Q.${String(q.id).padStart(2, '0')}`;

                btn.onclick = () => {
                    currentIndex = idx;
                    renderQuestion();
                    togglePaletteModal();
                };

                grid.appendChild(btn);
            });
        }

        // Custom Modal Alert (No Window.alert)
        function showAlertModal(msg) {
            document.getElementById('alert-msg').textContent = msg;
            document.getElementById('modal-alert').classList.remove('hidden');
        }

        function closeAlertModal() {
            document.getElementById('modal-alert').classList.add('hidden');
        }
    </script>
</body>
</html>
