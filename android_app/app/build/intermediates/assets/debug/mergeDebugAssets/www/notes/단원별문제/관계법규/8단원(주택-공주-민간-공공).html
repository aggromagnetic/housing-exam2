            }
        ];

        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let checkedState = new Array(quizData.length).fill(false);

        // DOM Elements Initialization
        const qCategory = document.getElementById('qCategory');
        const qType = document.getElementById('qType');
        const qNumBadge = document.getElementById('qNumBadge');
        const qQuestion = document.getElementById('qQuestion');
        const choiceOptionsContainer = document.getElementById('choiceOptionsContainer');
        const shortInputContainer = document.getElementById('shortInputContainer');
        const explanationBox = document.getElementById('explanationBox');
        const explanationContent = document.getElementById('explanationContent');
        const resultBadge = document.getElementById('resultBadge');
        const progressBar = document.getElementById('progressBar');
        const headerProgress = document.getElementById('headerProgress');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const qQuickNav = document.getElementById('qQuickNav');

        function initApp() {
            renderQuickNav();
            loadQuestion(0);
        }

        function renderQuickNav() {
            qQuickNav.innerHTML = '';
            quizData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-7 h-7 rounded-md text-xs font-bold transition flex items-center justify-center border ${getNavBtnStyle(idx)}`;
                btn.innerText = idx + 1;
                btn.onclick = () => jumpToQuestion(idx);
                qQuickNav.appendChild(btn);
            });
        }

        function getNavBtnStyle(idx) {
            if (idx === currentIndex) {
                return 'bg-blue-600 border-blue-400 text-white font-extrabold ring-2 ring-blue-400/50';
            }
            if (checkedState[idx]) {
                const isCorrect = isUserCorrect(idx);
                return isCorrect 
                    ? 'bg-emerald-900/60 border-emerald-600 text-emerald-300' 
                    : 'bg-rose-900/60 border-rose-600 text-rose-300';
            }
            if (userAnswers[idx] !== null) {
                return 'bg-amber-900/50 border-amber-600 text-amber-300';
            }
            return 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700';
        }

        function loadQuestion(index) {
            currentIndex = index;
            const item = quizData[index];

            // Progress Header & Bar
            headerProgress.innerText = `${index + 1} / ${quizData.length}`;
            progressBar.style.width = `${((index + 1) / quizData.length) * 100}%`;

            // Metadata
            qCategory.innerText = item.category;
            qType.innerText = item.type === 'choice' ? '객관식 5지선다' : '주관식 단답형';
            qNumBadge.innerText = `QUESTION #${String(index + 1).padStart(2, '0')}`;
            qQuestion.innerHTML = item.question;

            // Reset Input Containers
            choiceOptionsContainer.innerHTML = '';
            shortInputContainer.innerHTML = '';

            if (item.type === 'choice') {
                choiceOptionsContainer.classList.remove('hidden');
                shortInputContainer.classList.add('hidden');

                item.options.forEach((optText, optIdx) => {
                    const btn = document.createElement('button');
                    const selected = userAnswers[index] === (optIdx + 1);
                    
                    btn.className = `w-full text-left p-3.5 rounded-lg border transition-all duration-200 flex items-start space-x-3 text-sm md:text-base ${
                        selected 
                            ? 'bg-blue-900/40 border-blue-500 text-blue-200 ring-1 ring-blue-500' 
                            : 'bg-slate-800/60 border-slate-700/80 text-slate-300 hover:bg-slate-700/50 hover:border-slate-600'
                    }`;
                    btn.disabled = checkedState[index];
                    btn.onclick = () => selectChoice(optIdx + 1);
                    btn.innerHTML = `<span class="font-semibold shrink-0">${optText}</span>`;
                    choiceOptionsContainer.appendChild(btn);
                });
            } else {
                choiceOptionsContainer.classList.add('hidden');
                shortInputContainer.classList.remove('hidden');

                const savedAns = userAnswers[index] || [];
                item.blanks.forEach((blankLabel, bIdx) => {
                    const fieldGroup = document.createElement('div');
                    fieldGroup.className = 'flex flex-col space-y-1.5';
                    fieldGroup.innerHTML = `
                        <label class="text-xs font-bold text-blue-400">${blankLabel} 답 입력:</label>
                        <input type="text" 
                               id="blank_input_${bIdx}" 
                               value="${savedAns[bIdx] || ''}" 
                               ${checkedState[index] ? 'disabled' : ''}
                               oninput="handleShortInput(${bIdx}, this.value)"
                               placeholder="정답을 입력하세요" 
                               class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm md:text-base text-slate-100 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 disabled:opacity-60 transition">
                    `;
                    shortInputContainer.appendChild(fieldGroup);
                });
            }

            // Explanation Display Handle
            if (checkedState[index]) {
                showExplanation();
            } else {
                explanationBox.classList.add('hidden');
            }

            // Nav Buttons State
            btnPrev.disabled = index === 0;
            btnNext.innerText = index === quizData.length - 1 ? '최종 결과 보기' : '다음 문제';
            renderQuickNav();
        }

        function selectChoice(optionNum) {
            if (checkedState[currentIndex]) return;
            userAnswers[currentIndex] = optionNum;
            loadQuestion(currentIndex);
        }

        function handleShortInput(blankIdx, value) {
            if (checkedState[currentIndex]) return;
            if (!Array.isArray(userAnswers[currentIndex])) {
                userAnswers[currentIndex] = [];
            }
            userAnswers[currentIndex][blankIdx] = value.trim();
            renderQuickNav();
        }

        function submitAnswer() {
            const item = quizData[currentIndex];
            const currentAns = userAnswers[currentIndex];

            if (currentAns === null || (Array.isArray(currentAns) && currentAns.length === 0)) {
                alert('정답을 선택하거나 입력하신 후 확인해주세요!');
                return;
            }

            checkedState[currentIndex] = true;
            showExplanation();
            renderQuickNav();
            loadQuestion(currentIndex);
        }

        function isUserCorrect(index) {
            const item = quizData[index];
            const userAns = userAnswers[index];

            if (item.type === 'choice') {
                return userAns === item.answer;
            } else {
                if (!Array.isArray(userAns)) return false;
                return item.blanks.every((_, bIdx) => {
                    const uVal = (userAns[bIdx] || '').replaceAll(' ', '').toLowerCase();
                    const validOptions = item.altAnswers[bIdx].map(v => v.replaceAll(' ', '').toLowerCase());
                    return validOptions.includes(uVal);
                });
            }
        }

        function showExplanation() {
            const item = quizData[currentIndex];
            const correct = isUserCorrect(currentIndex);

            explanationBox.classList.remove('hidden');
            if (correct) {
                explanationBox.className = "mt-6 p-5 rounded-xl border bg-emerald-950/40 border-emerald-600/60 text-emerald-200";
                resultBadge.className = "font-bold text-xs px-2.5 py-1 rounded bg-emerald-600 text-white";
                resultBadge.innerText = "정답입니다!";
            } else {
                explanationBox.className = "mt-6 p-5 rounded-xl border bg-rose-950/40 border-rose-600/60 text-rose-200";
                resultBadge.className = "font-bold text-xs px-2.5 py-1 rounded bg-rose-600 text-white";
                resultBadge.innerText = "오답입니다!";
            }

            const correctDisplay = item.type === 'choice' 
                ? `${item.answer}번` 
                : item.blanks.map((b, i) => `${b} ${item.altAnswers[i][0]}`).join(', ');

            explanationContent.innerHTML = `
                <div class="mb-2 font-bold text-blue-300">
                    [정답]: ${correctDisplay}
                </div>
                <div>${item.explanation}</div>
            `;
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                showResults();
            }
        }

        function jumpToQuestion(idx) {
            loadQuestion(idx);
        }

        function showResults() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            let correctCount = 0;
            const wrongAnswersContainer = document.getElementById('wrongAnswerList');
            wrongAnswersContainer.innerHTML = '';

            quizData.forEach((q, idx) => {
                const correct = isUserCorrect(idx);
                if (correct) {
                    correctCount++;
                } else {
                    const wrongCard = document.createElement('div');
                    wrongCard.className = 'bg-slate-900/90 border border-slate-700/80 p-4 rounded-xl space-y-2';
                    
                    let userDisplay = '미응답';
                    if (userAnswers[idx] !== null) {
                        if (q.type === 'choice') {
                            userDisplay = `${userAnswers[idx]}번`;
                        } else {
                            userDisplay = Array.isArray(userAnswers[idx]) ? userAnswers[idx].join(', ') : userAnswers[idx];
                        }
                    }

                    const correctDisplay = q.type === 'choice' 
                        ? `${q.answer}번` 
                        : q.blanks.map((b, i) => `${b} ${q.altAnswers[i][0]}`).join(', ');

                    wrongCard.innerHTML = `
                        <div class="flex items-center justify-between text-xs font-semibold text-slate-400">
                            <span class="text-blue-400 font-bold">[${q.category}] 문제 ${q.id}번</span>
                            <span class="text-rose-400">오답</span>
                        </div>
                        <p class="text-sm font-medium text-slate-200">${q.question}</p>
                        <div class="grid grid-cols-2 gap-2 text-xs pt-1">
                            <div class="bg-rose-950/40 border border-rose-800/40 p-2 rounded text-rose-300">
                                <b>제출한 답:</b> ${userDisplay}
                            </div>
                            <div class="bg-emerald-950/40 border border-emerald-800/40 p-2 rounded text-emerald-300">
                                <b>정답:</b> ${correctDisplay}
                            </div>
                        </div>
                        <div class="text-xs text-slate-300 bg-slate-800/80 p-2.5 rounded border border-slate-700/50 mt-2">
                            ${q.explanation}
                        </div>
                    `;
                    wrongAnswersContainer.appendChild(wrongCard);
                }
            });

            const score = Math.round((correctCount / quizData.length) * 100);
            document.getElementById('scoreText').innerText = `${score}점`;
            document.getElementById('correctCountText').innerText = `${correctCount} / ${quizData.length}`;
            
            const passStatusText = document.getElementById('passStatusText');
            if (score >= 60) {
                passStatusText.className = "text-2xl font-extrabold text-emerald-400";
                passStatusText.innerText = "합격 (60점 이상)";
            } else {
                passStatusText.className = "text-2xl font-extrabold text-rose-400";
                passStatusText.innerText = "불합격 (복습 필요)";
            }

            if (correctCount === quizData.length) {
                wrongAnswersContainer.innerHTML = '<div class="text-center py-6 text-emerald-400 font-bold">축하합니다! 모든 문제를 맞히셨습니다. 완벽합니다!</div>';
            }
        }

        function resetQuiz() {
            currentIndex = 0;
            userAnswers = new Array(quizData.length).fill(null);
            checkedState = new Array(quizData.length).fill(false);
            
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            
            initApp();
        }

        // Initialize on Load
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
