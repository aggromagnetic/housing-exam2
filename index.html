<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주택관리사보 2차 스마트 학습 플랫폼 (관계법규 & 관리실무)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="logo-area">
            <button class="btn-icon" id="btn-toggle-sidebar" onclick="toggleSidebar()" title="목차 메뉴 접기/열기">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="logo-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                주택관리사보 2차 합격 메이트
            </div>
            <span class="logo-badge">PASS 2026</span>
        </div>

        <div class="nav-tabs">
            <button class="nav-btn active" id="btn-tab-viewer" onclick="switchView('viewer')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                강의 노트 뷰어
            </button>
            <button class="nav-btn" id="btn-tab-quiz" onclick="resumeQuizMode()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                풀던 퀴즈로 돌아가기
            </button>
            <button class="nav-btn" id="btn-tab-result" onclick="switchView('result')" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                퀴즈 오답 리포트
            </button>
        </div>

        <div class="header-actions">
            <button class="btn-theme-toggle" id="btn-theme-toggle" onclick="toggleTheme()" title="다크/라이트 모드 전환">
                🌙 다크모드
            </button>
            <div class="search-box">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="global-search-input" class="search-input" placeholder="조문, 숫자, 키워드 검색..." onkeyup="handleGlobalSearch(event)">
            </div>
            <button class="btn-quiz-start" onclick="startQuizMode()">
                🎯 실전 퀴즈 시작 (20문제)
            </button>
        </div>
    </header>

    <!-- Sidebar Overlay Backdrop for Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- App Container -->
    <div class="app-container">
        
        <!-- Sidebar: Lecture Tree -->
        <aside class="sidebar" id="app-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title-row">
                    <span>📚 강의 노트 목차</span>
                    <button class="btn-icon" onclick="closeSidebar()" style="width:28px; height:28px;">✕</button>
                </div>
                <div class="subject-filter">
                    <button class="filter-chip active" id="chip-all" onclick="filterSubject('all')">전체</button>
                    <button class="filter-chip" id="chip-rel" onclick="filterSubject('관계법규')">관계법규</button>
                    <button class="filter-chip" id="chip-prac" onclick="filterSubject('관리실무')">관리실무</button>
                    <button class="filter-chip" id="chip-rel-test" onclick="filterSubject('관계법규(문제)')">법규(문)</button>
                    <button class="filter-chip" id="chip-prac-test" onclick="filterSubject('관리실무(문제)')">실무(문)</button>
                </div>
            </div>

            <div class="lecture-list" id="lecture-list-container">
                <!-- Rendered dynamically via JavaScript -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- 1. Note Viewer Panel -->
            <section id="panel-viewer" class="view-panel active">
                <div class="note-viewer-header">
                    <div class="current-note-info">
                        <span class="subject-badge rel" id="current-note-badge">관계법규</span>
                        <div class="note-title" id="current-note-title">제29강. 하자보수보증금의 사용·반환...</div>
                    </div>
                    <div class="viewer-controls">
                        <button class="toggle-btn" id="btn-mask-toggle" onclick="toggleClozeMask()">
                            🔒 숫자/조문 가리기
                        </button>
                    </div>
                </div>
                <iframe id="note-frame" class="note-iframe" src="about:blank"></iframe>
            </section>

            <!-- 2. Quiz Panel -->
            <section id="panel-quiz" class="view-panel">
                <div class="quiz-container">
                    <div class="quiz-progress-bar">
                        <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
                    </div>

                    <div class="quiz-meta-row">
                        <span id="quiz-step-indicator">문제 1 / 20</span>
                        <span id="quiz-subject-tag" class="subject-badge rel">관계법규 (제29강)</span>
                    </div>

                    <div class="quiz-question-box" id="quiz-question-text">
                        질문이 로딩 중입니다...
                    </div>

                    <div class="quiz-input-group">
                        <label class="quiz-input-label">✍️ 정답 입력 (다단 빈칸인 경우 순서대로 쉼표 또는 공백 구분)</label>
                        <input type="text" id="quiz-answer-input" class="quiz-text-input" placeholder="정답을 입력하세요 (예: 2천, 30일)" autocomplete="off" onkeydown="handleQuizEnter(event)">
                    </div>

                    <!-- Instant Answer & Explanation Box (Initially Hidden) -->
                    <div id="quiz-instant-answer-box" class="quiz-instant-box" style="display: none;">
                        <div class="quiz-instant-header" id="quiz-instant-header">❌ 오답 처리됨 (정답 및 법정 해설)</div>
                        <div class="quiz-instant-ans-text" id="quiz-instant-ans-text">정답: </div>
                        <button class="btn-deeplink" id="quiz-instant-link-btn" style="margin-top: 8px;">
                            📖 원본 강의 노트 파트로 이동 복습
                        </button>
                    </div>

                    <div class="quiz-actions">
                        <button class="btn-secondary" id="btn-prev-quiz" onclick="prevQuizQuestion()">이전 문제</button>
                        <button class="btn-dont-know" id="btn-dont-know" onclick="showInstantAnswer()">💡 모르겠어요</button>
                        <button class="btn-submit-check" id="btn-check-quiz" onclick="checkCurrentQuestionAnswer()">✅ 정답 확인</button>
                        <button class="btn-primary" id="btn-next-quiz" onclick="nextQuizQuestion()">다음 문제 ➔</button>
                    </div>
                </div>
            </section>

            <!-- 3. Quiz Result Panel -->
            <section id="panel-result" class="view-panel">
                <div class="result-container">
                    <div class="result-card-header">
                        <h2 style="font-size: 20px; font-weight: 700;">🎉 퀴즈 평가 결과 리포트</h2>
                        <div class="score-display" id="result-score-text">85점</div>
                        <p style="color: var(--text-muted); font-size: 14px;" id="result-summary-text">총 20문제 중 17문제를 맞히셨습니다!</p>
                        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                            <button class="btn-quiz-start" onclick="startQuizMode()" style="display: inline-flex;">
                                🔄 새로운 가중치 퀴즈 풀기
                            </button>
                            <button class="btn-secondary" onclick="resetQuizStats()" style="font-size: 12px; color: var(--text-muted);">
                                🗑️ 오답 가중치 기록 초기화
                            </button>
                        </div>
                    </div>

                    <h3 style="font-size: 16px; margin-bottom: 16px; font-weight: 700;">📝 오답 및 문제별 해설 피드백</h3>
                    <div id="result-list-container">
                        <!-- Rendered via JS -->
                    </div>
                </div>
            </section>

            <!-- 4. Global Search Results Panel -->
            <section id="panel-search" class="view-panel">
                <div style="padding: 24px; max-width: 900px; margin: 0 auto; width: 100%; overflow-y: auto;">
                    <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">🔍 통합 검색 결과</h2>
                    <div id="search-results-container">
                        <!-- Rendered via JS -->
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
        <button class="mobile-nav-item active" id="m-nav-viewer" onclick="switchView('viewer')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            <span>강의노트</span>
        </button>
        <button class="mobile-nav-item" id="m-nav-quiz" onclick="resumeQuizMode()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span>풀던퀴즈</span>
        </button>
        <button class="mobile-nav-item" id="m-nav-result" onclick="switchView('result')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span>오답노트</span>
        </button>
        <button class="mobile-nav-item" id="m-nav-search" onclick="focusSearch()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>검색</span>
        </button>
        <button class="mobile-nav-item" id="m-nav-theme" onclick="toggleTheme()">
            <span style="font-size: 16px;">🌙</span>
            <span>테마</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
